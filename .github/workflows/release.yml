name: Trigger Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: kowabunga-cloud/workflows/.github/workflows/openapi-release.yml@v1
    secrets: inherit
    with:
      # SDKs get updated and released accordingly; Kahuna and Koala are
      # updated manually, as API changes may require changes on their side
      dispatch: kowabunga-go kowabunga-python
